[project]
name = "ca-weather-app-backend"
version = "0.1.0"
description = "Serverless Python AWS Lambda backend for the CA Weather App"
requires-python = ">=3.11"
# boto3 is used by the Backend_Service to invoke the Amazon Bedrock
# Converse API. It is bundled in the Lambda runtime at deploy time but is
# declared here so local development and tests can import it.
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.hypothesis]
# Default Hypothesis settings profile loaded by tests/conftest.py runs a
# minimum of 100 examples per property test.
max_examples = 100
